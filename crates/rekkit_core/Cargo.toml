[package]
name = "rekkit_core"
version = "0.1.0"
edition = "2021"
description = "Shared foundation library for Rekkit mods (energy systems, inventories, fluid tanks, connected grids, side config, multiblocks, frequency keys, and Horizon native hook traits)"
license = "MIT"

[lib]
crate-type = ["rlib"]

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
