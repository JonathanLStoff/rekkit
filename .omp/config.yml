# Generated by scripts/fleet/sync_agents.py: edit the generator, then run `make agents`.
# Rekkit on omp, usually a local model: keep the context small enough for the GPU (an 18 GB model on a
# 32 GB Mac has ~3-4 GB left for it). Raise thresholdTokens only if `ollama ps` shows room to spare and
# the model's num_ctx is larger; a cloud model in omp can set it higher in ~/.omp/agent/config.yml.
compaction:
  thresholdTokens: 32000
  keepRecentTokens: 8000
read:
  defaultLimit: 200
