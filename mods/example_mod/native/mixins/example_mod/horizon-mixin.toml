# Horizon Native Mixin Bundle Manifest (docs/native-mods.md)
# Read by horizon-mixins (horizon-mixins-core/src/manifest.rs) with deny_unknown_fields:
# [mod] takes only id, version and priority. The mod's name, description and authors live in
# horizon-registry.toml and content/horizon-mod.toml.

[mod]
id = "example_mod"
version = "0.1.0"

[compatibility]
horizon_revision = "ed102e0592eded5585c610c205488f771f52ac40"

# Lists the mod in Options > Mods. Hook point `mods` (native-hooks.json); the helper is compiled
# as a local function inside Game::native_mods, so NativeMod is in scope.
[[injection]]
id = "list-in-options"
target = "horizon_client::game::native_hooks::Game<'_>::native_mods"
kind = "HEAD"
helper = "list_mod.rs"
bindings = [{ name = "mods", ty = "&mut Vec<NativeMod>", value = "&mut *mods" }]
