# Horizon Native Mixin Bundle Manifest (docs/native-mods.md)
# Read by horizon-mixins (horizon-mixins-core/src/manifest.rs) with deny_unknown_fields:
# [mod] takes only id, version and priority.

[mod]
id = "redpower_2"
version = "0.1.2"

[compatibility]
horizon_revision = "ed102e0592eded5585c610c205488f771f52ac40"

[[injection]]
id = "list-in-options"
target = "horizon_client::game::native_hooks::Game<'_>::native_mods"
kind = "HEAD"
helper = "list_mod.rs"
bindings = [{ name = "mods", ty = "&mut Vec<NativeMod>", value = "&mut *mods" }]

[[injection]]
id = "block-entity"
target = "horizon_client::game::native_hooks::Game<'_>::native_block_entity"
kind = "HEAD"
helper = "block_entity.rs"
bindings = [
    { name = "block", ty = "&str", value = "block" },
    { name = "entity", ty = "&mut Option<(String, Compound)>", value = "&mut *entity" }
]

[[injection]]
id = "container"
target = "horizon_client::game::native_hooks::Game<'_>::native_block_entity_container"
kind = "HEAD"
helper = "container.rs"
bindings = [
    { name = "block", ty = "&str", value = "block" },
    { name = "container", ty = "&mut Option<ModContainer>", value = "&mut *container" }
]
